name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # for OIDC Trusted Publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.15"

      - name: Confirm tag name matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep "version = .*" pyproject.toml | sed -E 's/.*"(.*)"/\1/')
          [ "v$VERSION" = "$TAG" ] || exit 1

      - name: Build package
        run: |
          pip install -r .github/workflows/requirements/build.txt --require-hashes
          python -m build --no-isolation

      - name: Publish to TestPyPI via OIDC
        if: vars.ENABLE_PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
